[project]
name = "fraudlens"
version = "0.1.0"
description = "Explainable real-time card-fraud scoring service"
authors = [
    { name = "Ayush", email = "ayushsuryawanshi9@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "imbalanced-learn>=0.14.2",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "optuna>=5.1.0",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "prometheus-client>=0.26.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # modern syntax
    "N",            # naming
    "SIM", "C4",    # simplifications
    "PT",           # pytest style
    "ANN",          # type hints on every function
    "D",            # docstrings on every public object
    "S",            # security lints
    "RUF",
]

# X for a feature matrix is the scientific-Python convention; JSON documents are Any.
ignore = ["N803", "N806", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
# Colab orchestration cells shell out and import where they are used.
"notebooks/colab_training.ipynb" = ["S603", "S607", "E402"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kagglehub", "sklearn.*", "imblearn.*", "scipy.*", "locust.*"]
ignore_missing_imports = true

# Locust is only installed with the `load` group, so CI's type check runs without it.
# Skipping its types here too makes the local check see exactly what CI sees.
[[tool.mypy.overrides]]
module = ["locust", "locust.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["fraudlens.tools.locustfile"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/model"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs real Redis and Postgres",
    "data: needs the real datasets built by `make data` and `make features`; skipped if absent",
]

[tool.coverage.run]
source = ["fraudlens"]
branch = true
# Runs only inside Locust, in the load-test workflow.
omit = ["*/fraudlens/tools/locustfile.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "fakeredis[lua]>=2.40.0",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "shap>=0.54.1",
    "types-pyyaml>=6.0.12.20261113",
]
load = [
    "locust>=2.47.0",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]
