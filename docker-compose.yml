name: fraudlens

# The scoring service and its stores, for local development and integration tests.
# Every port binds to loopback only; nothing here is reachable from the network.
# The api service loads the newest bundle under ./models (mounted read-only).
# The web service is the analyst console on http://127.0.0.1:8080.

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy configs/.env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy configs/.env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy configs/.env.example to .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      # Inside the Compose network the stores are reached by service name.
      FRAUDLENS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FRAUDLENS_REDIS_URL: redis://redis:6379/0
      FRAUDLENS_WORKERS: ${FRAUDLENS_WORKERS:-1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # nginx adds the key to /api requests; the browser never holds it.
      FRAUDLENS_API_KEY: ${FRAUDLENS_API_KEY:?copy configs/.env.example to .env}
      FRAUDLENS_API_UPSTREAM: api:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
