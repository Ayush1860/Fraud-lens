# Training configuration, read by fraudlens.training.config.
# Every arm of the imbalance study uses `base_params`; tuning then searches `tuning.space`.

seeds: [0, 1, 2, 3, 4]
max_rounds: 2000
early_stopping_rounds: 50
n_boot: 200                         # day-block bootstrap resamples for 95% intervals
alert_budgets: [0.005, 0.01]        # shares of daily volume an analyst team could review

undersample_negatives_per_positive: 10   # arm A5: keep 10 genuine rows per fraud
smote_minority_ratio: 0.1                # arm A6: synthesise frauds up to 1 per 10 genuine
smote_k_neighbors: 5

base_params:
  max_depth: 6
  learning_rate: 0.1
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  gamma: 0.0

tuning:
  n_trials: 40
  n_folds: 3
  seed: 0
  space:
    max_depth: {type: int, low: 3, high: 8}
    learning_rate: {type: float, low: 0.02, high: 0.3, log: true}
    min_child_weight: {type: float, low: 1.0, high: 20.0}
    subsample: {type: float, low: 0.6, high: 1.0}
    colsample_bytree: {type: float, low: 0.5, high: 1.0}
    reg_lambda: {type: float, low: 0.001, high: 10.0, log: true}
    gamma: {type: float, low: 0.0, high: 5.0}
