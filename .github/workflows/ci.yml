name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    name: Unit tests and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not integration" --cov --cov-report=term-missing

  compose:
    name: Compose stores healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp configs/.env.example .env
      - name: Start Postgres and Redis and wait for health checks
        run: docker compose up -d --wait --wait-timeout 120
      - name: Assert both containers report healthy
        run: |
          docker compose ps
          for service in postgres redis; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "$service")")
            echo "$service: $status"
            test "$status" = "healthy"
          done
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
